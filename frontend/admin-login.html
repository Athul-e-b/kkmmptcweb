<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Sign-In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: { primary: { DEFAULT: '#0B4F9F', dark: '#083B78' }, secondary: { DEFAULT: '#D62828' } },
            fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Poppins', 'sans-serif'] }
        } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased bg-slate-100 min-h-screen">
    <main class="max-w-sm mx-auto px-4 py-16">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
            <div class="w-12 h-12 rounded-xl bg-primary/10 text-primary flex items-center justify-center mb-4"><i class="fa-solid fa-lock"></i></div>
            <h1 class="font-heading font-bold text-lg text-slate-900 mb-1">Admin Sign-In</h1>
            <p class="text-xs text-slate-500 mb-5">Enter the administrator password to continue.</p>
            <form id="loginForm" class="space-y-3 text-xs">
                <label class="block font-semibold text-slate-700">Password
                    <input id="adminPasswordInput" type="password" required class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm" autocomplete="current-password" placeholder="Enter password">
                </label>
                <div id="loginError" class="text-secondary text-xs hidden"></div>
                <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-2.5 rounded-lg text-sm">Sign In</button>
            </form>
        </div>
    </main>
    <script>
        const ADMIN_TOKEN_KEY = 'kkm_dept_admin_token';
        if (sessionStorage.getItem(ADMIN_TOKEN_KEY)) {
            window.location.replace('admin.html');
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('loginError');
            errorBox.classList.add('hidden');
            const password = document.getElementById('adminPasswordInput').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                let data = null;
                try { data = await res.json(); } catch (x) { /* ignore */ }
                if (!res.ok) {
                    const d = data && data.detail;
                    errorBox.textContent = typeof d === 'string' ? d : 'Sign-in failed';
                    errorBox.classList.remove('hidden');
                    return;
                }
                sessionStorage.setItem(ADMIN_TOKEN_KEY, data.access_token);
                window.location.replace('admin.html');
            } catch (err) {
                errorBox.textContent = 'Could not reach the server.';
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
