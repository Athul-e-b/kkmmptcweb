<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Department Dashboard</title>
    <link rel="icon" type="image/png" href="images/ihrd.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: { primary: { DEFAULT: '#0066FF', dark: '#0066FF' }, secondary: { DEFAULT: '#000000' } },
            fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Poppins', 'sans-serif'] }
        } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/fx.css">
    <link rel="stylesheet" href="css/dashboard-new.css">
</head>
<body class="auth-page dm-app antialiased">
    <div id="deptDash" class="dm-shell hidden">
        <aside class="dm-side" id="dmSide">
            <div class="dm-brand"><span class="dm-mark" aria-hidden="true">K</span><span class="dm-brand-full">KKMMPTC <span>Department</span></span></div>
            <nav class="dm-nav" aria-label="Dashboard">
                <button type="button" data-dm-panel="home" title="Dashboard"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="dm-label">Dashboard</span></button>
                <button type="button" data-dm-panel="details" title="Department details"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14 3v6h6M8 13h8M8 17h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">Department details</span></button>
                <button type="button" data-dm-panel="faculty" title="HOD and faculty"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M17 11a2.5 2.5 0 1 0-1.2-4.7M16.2 14.2A5 5 0 0 1 20.5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">HOD and faculty</span></button>
                <button type="button" data-dm-panel="clubs" title="Clubs and associations"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.8 18a4.2 4.2 0 0 1 8.4 0M11.8 18a4.2 4.2 0 0 1 8.4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">Clubs and associations</span></button>
                <button type="button" data-dm-panel="events" title="Activities and events"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">Activities and events</span></button>
                <button type="button" data-dm-panel="notices" title="Notices"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 7 2 7 2 9H4c0-2 2-2 2-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">Notices</span></button>
                <button type="button" data-dm-panel="projects" title="Projects and achievements"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.2 4.6 5 .7-3.6 3.5.9 5.2L12 15.8 7.5 18l.9-5.2L4.8 9.3l5-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="dm-label">Projects and achievements</span></button>
                <button type="button" data-dm-panel="reports" title="Activity reports"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 3v5h5M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">Activity reports</span></button>
                <button type="button" data-dm-panel="gallery" title="Photo gallery"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.4" fill="currentColor"/><path d="M7 17l3.5-3.5 2.2 2.2L16 12l3 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="dm-label">Photo gallery</span></button>
                <button type="button" class="dm-admin-only" data-dm-panel="accounts" title="Login accounts" hidden><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 19a5 5 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="14" y="11" width="7" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 11V9.5a1.5 1.5 0 0 1 3 0V11" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="dm-label">Login accounts</span></button>
                <button type="button" class="dm-admin-only" data-dm-panel="approvals" title="Approvals" hidden><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="dm-label">Approvals</span></button>
            </nav>
            <button type="button" id="dmCollapse" class="dm-soft" aria-label="Collapse sidebar" title="Collapse"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="dm-label">Collapse</span></button>
        </aside>
        <div class="dm-backdrop"></div>
        <div class="dm-body">
            <header class="dm-top">
                <button type="button" id="dmMenu" class="dm-iconbtn dm-menu" aria-label="Open menu"><svg class="dm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dm-label">Menu</span></button>
                <div>
                    <h1 id="deptTitle">Department</h1>
                    <p id="deptSignedInAs"></p>
                </div>
                <select id="dmDeptPick" aria-label="Department" hidden></select>
                <span id="dmRole" class="dm-role"></span>
                <button type="button" id="deptLogout" class="dm-danger">Logout</button>
            </header>
            <main id="dmMain" class="dm-main"></main>
        </div>
        <nav class="dm-tabbar" aria-label="Shortcuts">
            <button type="button" data-dm-panel="home">Home</button>
            <button type="button" data-dm-panel="details">Details</button>
            <button type="button" data-dm-panel="events">Events</button>
            <button type="button" data-dm-panel="notices">Notices</button>
        </nav>
    </div>
    <p id="deptDashStatus">Checking your department session…</p>
    <div id="dmToast" class="dm-toast" role="status" hidden></div>
    <dialog id="dmSheet" class="dm-sheet" aria-label="Editor"></dialog>
    <dialog id="dmAsk" class="dm-ask" aria-label="Please confirm"></dialog>
    <script src="js/department-auth.js"></script>
    <script src="js/dashboard-modules.js"></script>
    <script>
        function leaveDashboard() {
            clearDepartmentToken();
            window.location.replace('department-login.html');
        }

        async function loadDepartmentDashboard() {
            const status = document.getElementById('deptDashStatus');
            if (!getDepartmentToken()) {
                if (sessionStorage.getItem('kkm_dept_admin_token')) {
                    document.getElementById('deptDash').classList.remove('hidden');
                    status.classList.add('hidden');
                    startDepartmentApp({ role: 'admin' });
                    return;
                }
                leaveDashboard();
                return;
            }
            try {
                const { res, data } = await departmentApi('/api/department-auth/me');
                if (!res.ok || !data || !data.department_name) {
                    leaveDashboard();
                    return;
                }
                document.title = 'Department ' + data.department_name;
                document.getElementById('deptDash').classList.remove('hidden');
                status.classList.add('hidden');
                startDepartmentApp({ role: 'department', me: data });
            } catch (err) {
                status.textContent = 'Could not reach the server.';
            }
        }

        document.getElementById('deptLogout').addEventListener('click', async () => {
            const button = document.getElementById('deptLogout');
            button.disabled = true;
            if (window.dmIsAdmin && dmIsAdmin()) {
                sessionStorage.removeItem('kkm_dept_admin_token');
                window.location.replace('admin-login.html');
                return;
            }
            try {
                await departmentApi('/api/department-auth/logout', { method: 'POST' });
            } catch (err) { /* still clear the local session */ }
            leaveDashboard();
        });

        loadDepartmentDashboard();
    </script>
    <script src="js/fx.js"></script>
</body>
</html>
