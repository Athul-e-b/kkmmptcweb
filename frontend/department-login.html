<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Department Login</title>
    <link rel="icon" type="image/png" href="images/ihrd.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: { primary: { DEFAULT: '#0066FF', dark: '#0066FF' }, secondary: { DEFAULT: '#000000' } },
            fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Poppins', 'sans-serif'] }
        } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page antialiased bg-slate-100 min-h-screen">
    <main class="max-w-sm mx-auto px-4 py-16">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
            <a href="index.html" class="text-xs font-semibold text-primary hover:underline">Back to college website</a>
            <div class="w-12 h-12 rounded-xl bg-primary/10 text-primary flex items-center justify-center mt-4 mb-4"><i class="fa-solid fa-building-user"></i></div>
            <h1 class="font-heading font-bold text-lg text-slate-900 mb-1">Department Login</h1>
            <p class="text-xs text-slate-500 mb-5">Sign in with the username issued by the college administrator.</p>
            <form id="deptLoginForm" class="space-y-3 text-xs">
                <label class="block font-semibold text-slate-700">Username
                    <input id="deptUsername" name="username" type="text" required maxlength="32" autocomplete="username" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm" placeholder="Username">
                </label>
                <label class="block font-semibold text-slate-700">Password
                    <input id="deptPassword" name="password" type="password" required autocomplete="current-password" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm" placeholder="Password">
                </label>
                <div id="deptLoginError" class="text-secondary text-xs hidden" role="alert"></div>
                <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-2.5 rounded-lg text-sm">Login</button>
            </form>
        </div>
    </main>
    <script src="js/department-auth.js"></script>
    <script>
        if (getDepartmentToken()) {
            window.location.replace('department-dashboard.html');
        }
        document.getElementById('deptLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const errorBox = document.getElementById('deptLoginError');
            const button = event.target.querySelector('button[type="submit"]');
            errorBox.classList.add('hidden');
            const username = document.getElementById('deptUsername').value;
            const password = document.getElementById('deptPassword').value;
            button.disabled = true;
            button.textContent = 'Signing in…';
            try {
                const { res, data } = await departmentApi('/api/department-auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                if (!res.ok || !data || !data.access_token) {
                    errorBox.textContent = departmentErrorText(data, 'Sign-in failed');
                    errorBox.classList.remove('hidden');
                    button.disabled = false;
                    button.textContent = 'Login';
                    return;
                }
                sessionStorage.setItem(DEPT_TOKEN_KEY, data.access_token);
                window.location.replace('department-dashboard.html');
            } catch (err) {
                errorBox.textContent = 'Could not reach the server.';
                errorBox.classList.remove('hidden');
                button.disabled = false;
                button.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
